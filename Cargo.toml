[workspace]
resolver = "2"
members = [
    "crates/raft",
    "crates/storage",
    "crates/kv",
    "crates/sim",
    "crates/server",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
rand_chacha = "0.10"
rand_core = "0.10"
crc32fast = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
