<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concord Intersection</title>
<meta name="description" content="Three traffic controllers with and without Raft. Cut a cable or turn one off and watch what happens.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout (unchanged): top bar → two intersections side by side, each with counters and a caption.
   Signal Cabinet look: the steel controller cabinet beside the road. */
:root {
  /* Signal Cabinet: the steel controller cabinet beside the road */
  --bg: #c9cec4; --fg: #1d2420; --muted: #4d5a52; --card: #e3e6dc; --card-edge: #9aa395; --card-r: 6px;
  --card-shadow: inset 0 1px 0 #f4f6ef, 0 2px 0 #9aa395; --tile: #1c211e; --tile-fg: #ffb02e; --tile-muted: #a7b0a3;
  --btn: #2d3631; --btn-fg: #e9ede4; --btn-edge: #121613; --btn-r: 4px; --btn-shadow: inset 0 1px 0 #4a564f, 0 2px 0 #121613;
  --pill: #e3e6dc; --say: #f1f3ec; --say-edge: #ffb02e; --chip: #f1f3ec; --chip-edge: #6c776e;
  --head: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow Condensed", "Arial Narrow", sans-serif; --num: "Share Tech Mono", ui-monospace, monospace;
  --head-case: uppercase; --head-track: .06em;
  --concord: #1f5fd6; --baseline: #c4561a;
  --ground: #a9b39c; --asphalt: #3a3f45; --paint: #f2f2ec; --go: #18b46b; --amber: #f2a900; --stop: #e5352b; --off: #23272c;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); transition: background .2s; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 80px; }
@media (max-width: 480px) { .wrap { padding-inline: 16px; } }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--concord); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pill { min-height: 42px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; margin: 0; border-radius: var(--btn-r); background: var(--pill); border: 1px solid var(--card-edge); }
.brand { font: 700 20px var(--head); text-transform: var(--head-case); letter-spacing: var(--head-track); background: none; border: 0; padding-left: 0; }
.brand span { font: 500 15px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; }
.hint { font-weight: 600; font-size: 15px; }
.hint i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); flex: none; }
.spacer { flex: 1 1 0; min-width: 0; }
.net { font-size: 14px; color: var(--stop); font-weight: 600; }
.btn { cursor: pointer; font-weight: 700; font-size: 15px; background: var(--btn); color: var(--btn-fg); border: 1px solid var(--btn-edge); box-shadow: var(--btn-shadow); text-transform: var(--head-case); letter-spacing: var(--head-track); }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
@media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
.side { background: var(--card); border: 1px solid var(--card-edge); border-radius: var(--card-r); padding: 14px; min-width: 0; box-shadow: var(--card-shadow); }
.side h2 { margin: 0 2px; font: 700 22px var(--head); text-transform: var(--head-case); letter-spacing: var(--head-track); display: flex; align-items: center; gap: 8px; }
.side h2 i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.bl h2 i { background: var(--baseline); } .cc h2 i { background: var(--concord); }
.side .rule { margin: 4px 2px 10px; font-size: 14px; color: var(--muted); }
.stage { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: max(0px, calc(var(--card-r) - 6px)); overflow: hidden; }
.stage canvas { width: 100%; height: 100%; display: block; }

.cab { position: absolute; transform: translate(-50%, -50%); min-width: 80px; min-height: 44px; padding: 5px 8px; text-align: center; cursor: pointer;
  font: 700 14px/1.1 var(--head); text-transform: var(--head-case); letter-spacing: var(--head-track); color: var(--fg);
  background: var(--chip); border: 1px solid var(--chip-edge); border-radius: var(--btn-r); box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.cab small { display: block; font: 500 10.5px/1.35 var(--num); color: var(--muted); text-transform: none; letter-spacing: 0; }
.cab small.st { font-weight: 700; }
.bl .cab.lead small.st { color: var(--baseline); } .cc .cab.lead small.st { color: var(--concord); }
.cab.cut { outline: 2px dashed var(--amber); outline-offset: 1px; } .cab.cut small.st { color: var(--amber); }
.cab.down { opacity: .6; } .cab.down small.st { color: var(--stop); }
.cab.hub { cursor: default; opacity: .85; }

.foot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.stat { border-radius: var(--btn-r); padding: 8px 12px; background: var(--tile); color: var(--tile-fg); border: 1px solid var(--card-edge); }
.stat b { display: block; font: 700 26px/1.15 var(--num); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--tile-muted); font-weight: 600; }
.stat.hot b { color: #ff5a4a; }
.say { grid-column: 1 / -1; margin: 0; min-height: 3.4em; font-size: 15px; padding: 10px 14px; border-radius: var(--btn-r); background: var(--say); border-left: 4px solid var(--say-edge); }

.menu { position: absolute; z-index: 20; padding: 10px; display: grid; gap: 6px; min-width: 210px; background: var(--card); color: var(--fg); border: 1px solid var(--card-edge); border-radius: var(--card-r); box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.menu[hidden] { display: none; }
.menu h3 { margin: 0 4px; font: 700 15px var(--head); text-transform: var(--head-case); letter-spacing: var(--head-track); }
.menu p { margin: 0 4px 4px; font-size: 13px; color: var(--muted); }
.menu .btn { min-height: 40px; padding: 0 14px; text-align: left; border-radius: var(--btn-r); }

</style>
</head>
<body>

<div class="wrap">
  <header class="top lg-root" id="lg-top">
        <div class="glass pill brand">Concord <span>Intersection</span></div>
    <p class="glass pill hint"><i></i>Tap a controller to turn it off or cut its cable.</p>
    <span class="net" id="net" role="status"></span>
    <div class="spacer"></div>
    <button class="glass pill btn" id="play" title="Space">Pause</button>
    <button class="glass pill btn" id="reset">Reset</button>
  </header>

  <div class="pair">
    <section class="side bl" id="side-bl">
      <h2><i></i>Baseline</h2>
      <p class="rule">Three controllers, no Raft: each trusts only what it hears.</p>
      <div class="stage"><canvas aria-label="Baseline intersection"></canvas></div>
      <div class="foot lg-root">
                <div class="glass stat" data-k="collisions"><b>0</b><span>collisions</span></div>
        <div class="glass stat" data-k="through"><b>0</b><span>cars through</span></div>
        <div class="glass stat" data-k="wait"><b>0.0s</b><span>avg wait</span></div>
        <p class="glass say" aria-live="polite"><span class="txt"></span></p>
      </div>
    </section>
    <section class="side cc" id="side-cc">
      <h2><i></i>Concord</h2>
      <p class="rule">Three controllers with Raft: a green needs 2 of 3 to agree.</p>
      <div class="stage"><canvas aria-label="Concord intersection"></canvas></div>
      <div class="foot lg-root">
                <div class="glass stat" data-k="collisions"><b>0</b><span>collisions</span></div>
        <div class="glass stat" data-k="through"><b>0</b><span>cars through</span></div>
        <div class="glass stat" data-k="wait"><b>0.0s</b><span>avg wait</span></div>
        <p class="glass say" aria-live="polite"><span class="txt"></span></p>
      </div>
    </section>
  </div>
</div>
<div class="menu glass" id="menu" hidden role="menu"><h3 id="menuTitle">C1</h3><p id="menuSub"></p><button class="btn" id="mCut" role="menuitem"></button><button class="btn" id="mPow" role="menuitem"></button></div>

<script>
(() => {
// Lights and controllers come from the Rust simulator (GET /api/x/state). Concord's three
// controllers are a real Raft cluster there; this page only draws the cars and counts.
const W = 400, C = 200, LANE = 16, HALF = 40, STOPF = C - HALF - 6, CAR_L = 22, CAR_W = 12;
const css = () => { const s = getComputedStyle(document.documentElement), g = k => s.getPropertyValue(k).trim();
  return { ground: g('--ground'), asphalt: g('--asphalt'), paint: g('--paint'), go: g('--go'), amber: g('--amber'), stop: g('--stop'), off: g('--off'), fg: g('--fg'), head: g('--head') }; };
const COL = css();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const NAME = ['C1', 'C2', 'C3'], ROLE = ['North–South', 'East–West', 'backup'], DRIVES = ['NS', 'EW', null];
const DIRNAME = { NS: 'North–South', EW: 'East–West' };
const isGreen = x => x === 'go' || x === 'amber';
const KINDS = ['bl', 'cc'], KEY = { bl: 'baseline', cc: 'concord' };

let STATE = null;   // last /api/x/state
const lights = s => { const d = STATE && STATE[KEY[s.kind]]; return d ? { NS: d.ns, EW: d.ew } : { NS: 'stop', EW: 'stop' }; };
const ctrl = (kind, i) => STATE[KEY[kind]].ctrls[i];
const reach = (kind, i) => { const c = ctrl(kind, i); return c.alive && !c.cut; };

function makeSide(kind) {
  return { kind, collisions: 0, through: 0, waitSum: 0, cars: [], crashes: [], rnd: rng(42), carId: 0, clock: 0,
    spawnAt: { N: 0.5, S: 1.2, E: 0.8, W: 1.5 } };
}

// ---------------- captions ----------------
function say(kind, ev, d = {}) {
  const N = i => NAME[i];
  const others = n => [0, 1, 2].filter(m => m !== n && reach(kind, m)).map(m => NAME[m]).join(' and ') || 'nobody';
  const drives = i => DRIVES[i] ? DIRNAME[DRIVES[i]] : null;
  const T = {
    bl: {
      cut: () => drives(d.n) ? `${N(d.n)} lost its cable. Without Raft it can't tell whether the others are gone, so after a moment it starts running ${drives(d.n)} on its own.` : `${N(d.n)} lost its cable. It doesn't drive any lights, so nothing changes.`,
      alone: () => `${N(d.n)} is acting alone and keeps giving ${drives(d.n)} green. Nobody else agreed to that.`,
      conflict: () => 'Both directions are green. Two controllers each think they own the intersection.',
      off: () => drives(d.n) ? `${N(d.n)} was turned off and the ${drives(d.n)} lights went dark. The others don't change their plan, so cross traffic keeps getting green while drivers on the dark road edge out.` : `${N(d.n)} was turned off. It doesn't drive any lights, so nothing changes.`,
      on: () => `${N(d.n)} is back on and copied the current plan.`,
      rejoin: () => `${N(d.n)} reconnected and dropped the plan it made up alone. Any crashes already happened.`,
      takeover: () => `${N(d.to)} stopped hearing the leader and took over planning.`,
    },
    cc: {
      cut: () => drives(d.n) ? `${N(d.n)} lost its cable. ${others(d.n)} still make 2 of 3, so they agree to flash red everywhere until it's back. ${N(d.n)} can't reach a majority, so it finishes its last agreed green and then flashes too.` : `${N(d.n)} lost its cable. ${others(d.n)} still make 2 of 3 and both light controllers are fine, so the lights keep cycling.`,
      off: () => drives(d.n) ? `${N(d.n)} was turned off and the ${drives(d.n)} lights went dark. ${others(d.n)} still make 2 of 3 and agree to flash red everywhere, an all-way stop, so no one gets a green next to a dark signal.` : `${N(d.n)} was turned off. ${others(d.n)} still make 2 of 3, so the lights keep cycling normally.`,
      on: () => `${N(d.n)} is back on. It reloaded its saved log, and once all three agree, normal cycling resumes.`,
      rejoin: () => `${N(d.n)} reconnected and copied the agreed plan. Normal cycling resumes.`,
      elect: () => `${N(d.to)} won a majority vote and now leads.`,
      minority: () => 'Only one controller can talk. One of three is not a majority, so nothing new can be agreed: the lights finish the agreed plan, then flash red.',
      conflict: () => 'Both directions green. This should never happen with Concord.',
    },
  }[kind][ev];
  if (kind === 'cc' && (ev === 'cut' || ev === 'off') && STATE && !STATE.concord.majority) return say(kind, 'minority');
  if (T) setText(document.querySelector(`#side-${kind} .say .txt`), T());
}

// ---------------- server ----------------
async function api(method, path) {
  try {
    const r = await fetch(path, { method, credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { setText(document.getElementById('net'), 'Reconnecting to the simulator…'); return null; }
}
function take(next) {
  if (!next) return;
  setText(document.getElementById('net'), '');
  const prev = STATE; STATE = next;
  if (!prev) return;
  // Leader changes and other things the server decided on its own.
  if (prev.baseline.leader !== next.baseline.leader) say('bl', 'takeover', { to: next.baseline.leader - 1 });
  next.baseline.ctrls.forEach((c, i) => { if (c.alone && !prev.baseline.ctrls[i].alone) say('bl', 'alone', { n: i }); });
  if (next.concord.leader && prev.concord.leader !== next.concord.leader && prev.concord.leader !== null) say('cc', 'elect', { to: next.concord.leader - 1 });
  if (prev.concord.majority && !next.concord.majority) say('cc', 'minority');
  for (const k of KINDS) {
    const was = isGreen(prev[KEY[k]].ns) && isGreen(prev[KEY[k]].ew), now = isGreen(next[KEY[k]].ns) && isGreen(next[KEY[k]].ew);
    if (now && !was) say(k, 'conflict');
  }
}
let polling = false;
async function poll() {
  if (playing && !polling) { polling = true; take(await api('GET', '/api/x/state')); polling = false; }
  setTimeout(poll, 150);
}
async function act(kind, i) {
  const c = ctrl('cc', i);
  if (kind === 'cable' && !c.alive) return;
  const path = kind === 'cable' ? '/api/x/cable' : '/api/x/power';
  take(await api('POST', `${path}?id=${i + 1}`));
  if (!STATE) return;
  const n = ctrl('cc', i);
  const ev = kind === 'cable' ? (n.cut ? 'cut' : 'rejoin') : (n.alive ? 'on' : 'off');
  for (const k of KINDS) say(k, ev, { n: i });
}

// ---------------- cars ----------------
const AXIS = { N: 'NS', S: 'NS', E: 'EW', W: 'EW' };
function carRect(car) {
  const f = car.f, L = CAR_L, w = CAR_W;
  if (car.ap === 'N') return { x: C - LANE - w / 2, y: f - L, w, h: L };
  if (car.ap === 'S') return { x: C + LANE - w / 2, y: W - f, w, h: L };
  if (car.ap === 'W') return { x: f - L, y: C + LANE - w / 2, w: L, h: w };
  return { x: W - f, y: C - LANE - w / 2, w: L, h: w };
}
const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
// At a dark or flashing signal a driver treats it as a stop sign: stop, then go only when no
// crossing car is in or about to enter the box.
const crossTraffic = (s, car) => s.cars.some(c => !c.dead && AXIS[c.ap] !== AXIS[car.ap] && c.f > STOPF - 140 && c.f - CAR_L < C + HALF + 6 && (c.cleared || c.f > STOPF + 0.5));
// A driver with a green still won't drive into a crossing car that pulled in at a dark or
// flashing signal. Two cars that were both given green get no such warning.
const crossInBox = (s, car) => s.cars.some(c => !c.dead && AXIS[c.ap] !== AXIS[car.ap] && c.stopSign && inBox(c));
const inBox = c => c.f > STOPF + 0.5 && c.f - CAR_L < C + HALF + 6;
function moveCars(s, dt, now) {
  const L = lights(s);
  s.waiting = s.cars.filter(c => !c.cleared && c.f >= STOPF - 60 && c.f <= STOPF + 0.5).length;
  for (const ap of ['N', 'S', 'E', 'W']) {
    if (s.clock < s.spawnAt[ap]) continue;
    const tail = s.cars.filter(c => c.ap === ap).reduce((m, c) => (!m || c.f < m.f ? c : m), null);
    if (!tail || tail.f > CAR_L + 10) s.cars.push({ id: ++s.carId, ap, f: 0, waitSince: null, cleared: false, waited: 0, hue: Math.floor(s.rnd() * 6) });
    s.spawnAt[ap] = s.clock + 1.6 + s.rnd() * 2.2;
  }
  const v = 70 * dt;
  const queue = s.cars.filter(c => !c.cleared && c.waitSince != null).sort((a, b) => a.waitSince - b.waitSince);
  const boxFree = !s.cars.some(inBox);
  for (const car of [...s.cars].sort((a, b) => b.f - a.f)) {
    let limit = Infinity;
    const ahead = s.cars.filter(c => c.ap === car.ap && c.f > car.f).reduce((m, c) => (!m || c.f < m.f ? c : m), null);
    if (ahead) limit = ahead.f - CAR_L - 6;
    const sig = L[AXIS[car.ap]];
    if (car.f <= STOPF && !car.cleared) {
      // A driver commits to entering only at the stop line; further back they just keep rolling on green.
      if ((sig === 'go' || sig === 'amber') && crossInBox(s, car)) limit = Math.min(limit, STOPF);
      else if (sig === 'go') { if (car.f >= STOPF - 2) car.cleared = true; }
      else if (sig === 'amber' && car.f > STOPF - 14) car.cleared = true;
      else {
        limit = Math.min(limit, STOPF);
        if (car.f >= STOPF - 0.5) {
          if (car.waitSince == null) car.waitSince = now;
          if ((sig === 'flash' || sig === 'dark') && now - car.waitSince > 700 && boxFree && queue[0] === car && !crossTraffic(s, car)) { car.cleared = true; car.stopSign = true; }
        }
      }
    }
    const before = car.f;
    car.f = Math.min(car.f + v, Math.max(car.f, limit));
    if (car.f - before < v * 0.5) car.waited += dt;
  }
  for (const a of s.cars) for (const b of s.cars) {
    if (a.id < b.id && AXIS[a.ap] !== AXIS[b.ap] && !a.dead && !b.dead && overlap(carRect(a), carRect(b))) {
      a.dead = b.dead = true; s.collisions++; const r = carRect(a); s.crashes.push({ x: r.x + r.w / 2, y: r.y + r.h / 2, until: now + 1400 });
    }
  }
  for (const c of s.cars) if (!c.dead && c.f >= W + CAR_L + 4) { s.through++; s.waitSum += c.waited; }
  s.cars = s.cars.filter(c => !c.dead && c.f < W + CAR_L + 4);
}



// ---------------- drawing ----------------
const HUES = ['#e8e3d8', '#9fb7d9', '#d98f7a', '#8fc7a2', '#d6c27a', '#b9a3d6'];
const CAB = [[66, 66], [W - 66, W - 66], [W - 66, 66]];
const CTRLS = s => STATE ? STATE[KEY[s.kind]].ctrls : [0, 1, 2].map(() => ({ alive: true, cut: false }));
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function draw(s, ctx, now) {
  ctx.fillStyle = COL.ground; ctx.fillRect(0, 0, W, W);
  ctx.lineWidth = 2;
  for (const [a, b] of [[0, 1], [0, 2], [1, 2]]) {
    const A = CTRLS(s)[a], B = CTRLS(s)[b]; if (!A.alive || !B.alive) continue;
    const bad = A.cut || B.cut;
    ctx.strokeStyle = bad ? COL.amber : COL.fg; ctx.globalAlpha = bad ? .9 : .35; ctx.setLineDash(bad ? [5, 6] : []);
    ctx.beginPath(); ctx.moveTo(...CAB[a]); ctx.lineTo(...CAB[b]); ctx.stroke(); ctx.globalAlpha = 1; ctx.setLineDash([]);
  }
  ctx.fillStyle = COL.asphalt; ctx.fillRect(C - HALF, 0, HALF * 2, W); ctx.fillRect(0, C - HALF, W, HALF * 2);
  ctx.strokeStyle = COL.paint; ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
  ctx.beginPath(); ctx.moveTo(C, 0); ctx.lineTo(C, C - HALF); ctx.moveTo(C, C + HALF); ctx.lineTo(C, W);
  ctx.moveTo(0, C); ctx.lineTo(C - HALF, C); ctx.moveTo(C + HALF, C); ctx.lineTo(W, C); ctx.stroke(); ctx.setLineDash([]);
  ctx.lineWidth = 4; ctx.beginPath();
  ctx.moveTo(C - HALF, C - HALF - 4); ctx.lineTo(C, C - HALF - 4); ctx.moveTo(C, C + HALF + 4); ctx.lineTo(C + HALF, C + HALF + 4);
  ctx.moveTo(C - HALF - 4, C); ctx.lineTo(C - HALF - 4, C + HALF); ctx.moveTo(C + HALF + 4, C - HALF); ctx.lineTo(C + HALF + 4, C); ctx.stroke();
  const L = lights(s), blink = reduce || Math.floor(now / 500) % 2 === 0;
  const lamp = st => st === 'go' ? COL.go : st === 'amber' ? COL.amber : st === 'stop' ? COL.stop : st === 'flash' && blink ? COL.stop : COL.off;
  for (const [ax, x, y] of [['NS', C - HALF - 12, C - HALF - 12], ['NS', C + HALF + 12, C + HALF + 12], ['EW', C - HALF - 12, C + HALF + 12], ['EW', C + HALF + 12, C - HALF - 12]]) {
    ctx.fillStyle = COL.off; ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fill();
    ctx.fillStyle = lamp(L[ax]); ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
  }
  for (const car of s.cars) {
    const r = carRect(car); ctx.fillStyle = HUES[car.hue]; roundRect(ctx, r.x, r.y, r.w, r.h, 3); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    if (AXIS[car.ap] === 'NS') ctx.fillRect(r.x + 2, car.ap === 'N' ? r.y + r.h - 8 : r.y + 4, r.w - 4, 4);
    else ctx.fillRect(car.ap === 'W' ? r.x + r.w - 8 : r.x + 4, r.y + 2, 4, r.h - 4);
  }
  s.crashes = s.crashes.filter(c => c.until > now);
  for (const c of s.crashes) {
    const k = (c.until - now) / 1400; ctx.fillStyle = COL.stop; ctx.globalAlpha = reduce ? .85 : .35 + .55 * k;
    ctx.beginPath(); for (let a = 0; a < 16; a++) { const r = a % 2 ? 9 : 22; ctx.lineTo(c.x + r * Math.cos(a * Math.PI / 8), c.y + r * Math.sin(a * Math.PI / 8)); } ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = `700 12px ${COL.head}`; ctx.textAlign = 'center'; ctx.fillText('CRASH', c.x, c.y + 4);
  }
  ctx.font = `700 15px ${COL.head}`; ctx.textAlign = 'center'; ctx.fillStyle = COL.stop;
  if (isGreen(L.NS) && isGreen(L.EW)) ctx.fillText('BOTH DIRECTIONS GREEN', C, 24);
  else if (L.NS === 'flash' && L.EW === 'flash') ctx.fillText('FLASHING RED · ALL-WAY STOP', C, 24);
  else if (L.NS === 'dark' || L.EW === 'dark') ctx.fillText('SIGNALS DARK', C, 24);
}


// ---------------- UI ----------------
let SIDES, playing = true, last = performance.now();
const views = {};
function setText(el, text) { if (el && el.textContent !== text) el.textContent = text; }
function setup() {
  SIDES = KINDS.map(makeSide);
  for (const s of SIDES) {
    const root = document.getElementById('side-' + s.kind), stage = root.querySelector('.stage');
    stage.querySelectorAll('.cab').forEach(e => e.remove());
    const cabs = CAB.map(([x, y], i) => { const b = document.createElement('button'); b.className = 'cab';
      b.style.left = (x / W * 100) + '%'; b.style.top = (y / W * 100) + '%'; b.onclick = () => openMenu(i, b); stage.appendChild(b); return b; });
    views[s.kind] = { canvas: stage.querySelector('canvas'), ctx: stage.querySelector('canvas').getContext('2d'), cabs, root };
  }
  setText(document.querySelector('#side-bl .say .txt'), 'All three controllers are talking. C2 plans the cycle.');
  setText(document.querySelector('#side-cc .say .txt'), 'C2 leads. Every green needs 2 of 3 controllers to agree.');
  fit();
}
function fit() { for (const k in views) { const cv = views[k].canvas, r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d)); views[k].ctx.setTransform(cv.width / W, 0, 0, cv.height / W, 0, 0); } }
addEventListener('resize', fit);
function status(kind, i) {
  if (!STATE) return '…';
  const c = ctrl(kind, i), d = STATE[KEY[kind]];
  if (!c.alive) return 'OFF';
  if (c.cut) return kind === 'bl' && c.alone ? 'CUT · ALONE' : 'CUT OFF';
  return d.leader === i + 1 ? 'LEADER' : 'OK';
}
function renderUI(s) {
  const v = views[s.kind];
  for (let i = 0; i < 3; i++) {
    const st = status(s.kind, i), b = v.cabs[i], c = STATE ? ctrl(s.kind, i) : { alive: true, cut: false };
    const cls = 'cab' + (st === 'LEADER' ? ' lead' : '') + (c.cut ? ' cut' : '') + (!c.alive ? ' down' : '');
    if (b.className !== cls) b.className = cls;
    const html = `${NAME[i]}<small>${ROLE[i]}</small><small class="st">${st}</small>`;
    if (b.innerHTML !== html) b.innerHTML = html;
    b.setAttribute('aria-label', `${NAME[i]}, ${ROLE[i]}, ${st}. Open controls`);
  }
  const vals = { collisions: String(s.collisions), through: String(s.through), wait: (s.through ? s.waitSum / s.through : 0).toFixed(1) + 's' };
  for (const k in vals) {
    const el = v.root.querySelector(`[data-k="${k}"]`); setText(el.querySelector('b'), vals[k]);
    el.classList.toggle('hot', k === 'collisions' && s.collisions > 0);
  }
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && STATE) for (const s of SIDES) { s.clock += dt; moveCars(s, dt, now); }
  for (const s of SIDES) { draw(s, views[s.kind].ctx, now); renderUI(s); }
  requestAnimationFrame(frame);
}
const menu = document.getElementById('menu'); let menuFor = null;
function openMenu(i, anchor) {
  if (!STATE) return;
  menuFor = i; const n = ctrl('cc', i);
  document.getElementById('menuTitle').textContent = `${NAME[i]} · ${ROLE[i]}`;
  document.getElementById('menuSub').textContent = 'Applies to both intersections.';
  document.getElementById('mCut').textContent = n.cut ? 'Reconnect cable' : 'Cut cable';
  document.getElementById('mCut').disabled = !n.alive;
  document.getElementById('mPow').textContent = n.alive ? 'Turn off' : 'Turn on';
  menu.hidden = false;
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(scrollX + r.left, scrollX + document.documentElement.clientWidth - menu.offsetWidth - 8)) + 'px';
  menu.style.top = (scrollY + r.bottom + 6) + 'px';
  document.getElementById(n.alive ? 'mCut' : 'mPow').focus();
}
document.getElementById('mCut').onclick = () => { act('cable', menuFor); menu.hidden = true; };
document.getElementById('mPow').onclick = () => { act('power', menuFor); menu.hidden = true; };
document.addEventListener('click', e => { if (!e.target.closest('.menu, .cab')) menu.hidden = true; });
addEventListener('keydown', e => {
  if (e.key === 'Escape') menu.hidden = true;
  const k = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
  if (k != null && STATE) act(e.shiftKey ? 'power' : 'cable', k);
  if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); togglePlay(); }
});
// Pausing stops polling, and the server only advances a session when it is asked.
function togglePlay() { playing = !playing; setText(document.getElementById('play'), playing ? 'Pause' : 'Play'); }
document.getElementById('play').onclick = togglePlay;
document.getElementById('reset').onclick = async () => { setup(); STATE = null; take(await api('POST', '/api/x/reset')); };
setup();
poll();
requestAnimationFrame(frame);
})();
</script>
